name: Build multiplateforme (Tauri)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  desktop:
    name: Tauri Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/shared/package.json
            packages/blockly-static/package.json
            BlocklyDuino-v2-react/package.json

      - name: Installer Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Installer les dépendances système (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Installer les dépendances npm
        run: npm ci

      - name: Build du package partagé
        run: npm run build:shared

      - name: Synchroniser Blockly static
        run: npm run build:blockly-static

      - name: Build web
        run: npm run build:web
        env:
          CI: true
          NODE_ENV: production

      - name: Build l'application native Tauri
        working-directory: BlocklyDuino-v2-react
        run: npx tauri build
        env:
          CI: true

      - name: Upload l'artéfact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: blockly-ia-tauri-win
          path: BlocklyDuino-v2-react/src-tauri/target/release/bundle/
          compression-level: 0
          retention-days: 7

      - name: Upload l'artéfact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: blockly-ia-tauri-mac
          path: BlocklyDuino-v2-react/src-tauri/target/release/bundle/
          compression-level: 0
          retention-days: 7

      - name: Upload l'artéfact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: blockly-ia-tauri-linux
          path: BlocklyDuino-v2-react/src-tauri/target/release/bundle/
          compression-level: 0
          retention-days: 7

  android:
    name: Tauri Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            BlocklyDuino-v2-react/package.json

      - name: Installer Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Installer les dépendances npm
        run: npm ci

      - name: Build shared + web
        run: |
          npm run build:shared
          npm run build:web
        env:
          CI: true
          NODE_ENV: production

      - name: Ajouter la cible Android à Rust
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Initialiser le projet Android
        working-directory: BlocklyDuino-v2-react
        run: npx tauri android init

      - name: Générer le keystore pour la signature
        run: |
          keytool -genkey -v -keystore android.keystore \
            -alias hakilidia-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hakilidia123 -keypass hakilidia123 \
            -dname "CN=Hakilidia, OU=Hakilidia, O=Hakilidia, L=Dakar, S=DK, C=SN"

      - name: Copier le keystore dans le projet Android
        run: |
          cp android.keystore BlocklyDuino-v2-react/src-tauri/gen/android/app/

      - name: Injecter la config de signature
        working-directory: BlocklyDuino-v2-react/src-tauri/gen/android/app
        run: |
          cat >> build.gradle.kts << 'EOF'

          android {
            signingConfigs {
              create("release") {
                storeFile = file("android.keystore")
                storePassword = "hakilidia123"
                keyAlias = "hakilidia-release"
                keyPassword = "hakilidia123"
              }
            }
            buildTypes {
              getByName("release") {
                signingConfig = signingConfigs.getByName("release")
              }
            }
          }
          EOF

      - name: Build l'APK Android (release)
        working-directory: BlocklyDuino-v2-react
        run: npx tauri android build --target aarch64 -- --release
        env:
          CI: true

      - name: Upload l'APK
        uses: actions/upload-artifact@v4
        with:
          name: hakilidia-blockly-android-apk
          path: BlocklyDuino-v2-react/src-tauri/gen/android/app/build/outputs/apk/
          compression-level: 0
          retention-days: 7
