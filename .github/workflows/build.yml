name: Build multiplateforme

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # permet un déclenchement manuel depuis l'UI GitHub

jobs:
  build:
    strategy:
      fail-fast: false # ne pas annuler les autres OS si un échoue
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/shared/package.json
            packages/blockly-static/package.json
            BlocklyDuino-v2-react/package.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build du package partagé
        run: npm run build:shared

      - name: Synchroniser Blockly static
        run: npm run build:blockly-static

      - name: Build web (TypeScript + Vite)
        run: npm run build:web
        env:
          CI: true
          NODE_ENV: production

      - name: Upload l'artéfact web (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: blockly-ia-web-${{ matrix.os }}
          path: BlocklyDuino-v2-react/dist/
          compression-level: 9
          retention-days: 7

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            BlocklyDuino-v2-react/package.json

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Build shared + web
        run: |
          npm run build:shared
          npm run build:web
        env:
          CI: true
          NODE_ENV: production

      - name: Ajouter la plateforme Android
        working-directory: BlocklyDuino-v2-react
        run: npx cap add android

      - name: Synchroniser le projet Android
        working-directory: BlocklyDuino-v2-react
        run: npx cap sync android

      - name: Build l'APK debug
        working-directory: BlocklyDuino-v2-react/android
        run: ./gradlew assembleDebug

      - name: Upload l'APK
        uses: actions/upload-artifact@v4
        with:
          name: blockly-ia-android-apk
          path: BlocklyDuino-v2-react/android/app/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 7
